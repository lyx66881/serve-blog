server:
  port: 8080

spring:
  application:
    name: blog-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/blog_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:blog123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  jackson:
    # 响应中为 null 的字段不输出，前端 TS 可用可选字段处理
    default-property-inclusion: non_null
  mail:
    # SMTP 配置（生产环境通过环境变量注入，如 MAIL_HOST=smtp.qq.com）
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖（HS256，至少 32 字节）
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789abcdef0123456789abcdef}
    # JWT 过期时间（小时）
    expire-hours: ${JWT_EXPIRE_HOURS:72}
  upload:
    # 上传文件根目录（生产环境通过 UPLOAD_BASE_DIR 覆盖，勿放项目源码目录内）
    base-dir: ${UPLOAD_BASE_DIR:/data/blog/uploads}
    # 静态资源访问前缀，与 WebConfig 中的映射保持一致
    base-url: /uploads
    # 单文件大小上限（MB）
    max-size-mb: 10
  cors:
    # 允许的跨域来源，逗号分隔；* 表示全部放行（仅限开发）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  mail:
    # false = 模拟模式（验证码仅记日志并随响应返回 devCode）；配置好 SMTP 后设为 true
    enabled: ${MAIL_ENABLED:false}
    # 发件人，须与 SMTP 账号一致
    from: ${MAIL_FROM:no-reply@blog.local}
  email-code:
    # 验证码有效期（分钟）
    expire-minutes: 10
    # 可再次发送的最小间隔（秒）
    resend-interval-seconds: 60
    # 验证失败次数上限，达到后验证码作废
    max-attempts: 5
  admin:
    # 初始管理员账号：启动时不存在则创建，已存在则提升为管理员角色
    username: ${ADMIN_USERNAME:admin}
    # 生产环境务必通过环境变量覆盖初始密码
    password: ${ADMIN_PASSWORD:admin123456}
    nickname: ${ADMIN_NICKNAME:管理员}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.blog: info
